<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Cards with Hover Effect</title>
    <!-- Load Tailwind CSS for responsive utilities (as required by environment) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font as default -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&display=swap");

        /* variables */
        :root{
            --ff: "Montserrat", sans-serif;
            --ff-inter: "Inter", sans-serif;
            --colorp: #f9f9f9; /* Primary light text */
            --colora: #ffe537; /* Yellow/Gold Accent for buttons */
            --colora2: #537fe7; /* Blue Accent for active state */
            --colorbody: #1e1e1e; /* Dark Background */
            --h2: bold clamp(2rem, 2.5vw, 3rem)/1.5em var(--ff);
            --p: 1rem/1.8em var(--ff-inter);
            --colorgray: hsl(0, 0%, 60%); /* Secondary gray text */
            --graygradient: linear-gradient(45deg, hsl(0, 0%, 20%), hsl(0, 0%, 15%)); /* Card background */
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        body {
            max-width: 1000px;
            width: 90vw;
            margin: 40px auto;
            background-color: var(--colorbody);
            color: var(--colorp);
            font: var(--p);
            padding-bottom: 80px;
        }
        h2{font: var(--h2);}
        p { margin: 1rem 0; }

        /* Button Styling and Hover Effect */
        button{
            background: none;
            padding: 12px 24px;
            font: var(--p);
            color: var(--colora);
            border-radius: 12px;
            border: solid 1px var(--colora);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 24px;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 229, 55, 0.3);
            background-color: rgba(255, 229, 55, 0.1);
        }
        button:active{
            scale: .95;
            transform: translateY(0);
            box-shadow: none;
        }

        /* Default label styles for standard radio buttons */
        label{font: var(--p);}

        /* Toggle logic for radio button display */
        .no-radio-buttons { display: none; }
        .radio-cards { display: flex; }
        
        .show-plain .no-radio-buttons { display: block; }
        .show-plain .radio-cards { display: none; }


        /* Actual Card Code */
        .radio-cards{
            font: var(--p);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* Radio Card Styling and Hover Effect */
        .radio-card{
            padding: 20px;
            border-radius: 20px;
            background: var(--graygradient);
            position: relative;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 150px;
            cursor: pointer;
            transition: var(--transition);
        }

        .radio-card:hover{
            transform: translateY(-12px); /* Lifts the card on hover */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Hide the native radio button */
        .radio-card input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        /* Ensure the label (which now contains all content) flows normally */
        .radio-card label {
            display: block;
            cursor: pointer;
        }

        /* Style the card title */
        .radio-card .card-title {
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--colorgray);
            margin-left: -8px;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* The custom checkmark circle (::before on the card wrapper) */
        .radio-card::before {
            content: '';
            position: absolute;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 20px;
            background-color: transparent;
            border: solid 2px var(--colorp);
            border-radius: 50%;
            z-index: 20;
            pointer-events: none;
            transition: var(--transition);
        }

        /* Checked state: blue border on card, blue checkmark indicator, blue title text */

        /* 1. Card Blue Border (::after on the card wrapper) */
        .radio-card:has(input[type="radio"]:checked)::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid var(--colora2); /* Blue border for checked state */
            border-radius: 20px;
            pointer-events: none;
        }

        /* 2. Checkmark Indicator (::before on the card wrapper) */
        .radio-card:has(input[type="radio"]:checked)::before {
            border: solid 2px var(--colora2);
            background-color: var(--colora2);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>');
            background-size: 80%;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* 3. Highlighted Text (Title and Pixels) */
        .radio-card:has(input[type="radio"]:checked) .card-title {
            color: var(--colora2); /* Blue title text when checked */
        }
        .radio-card:has(input[type="radio"]:checked) .pixels-no {
            color: var(--colora2); /* Blue pixel number when checked */
        }


        .pixels-no{
            font: var(--h2);
            line-height: .5em;
        }
    </style>
</head>
<body class="">
    <!-- Main content -->
    <p class="text-xl text-gray-400 mb-4">Turn bland elements into elegant, responsive cards with interactive hover effects.</p>
    <button id="toggle" class="hover:shadow-lg">Toggle Display (Current: Standard)</button>

    <h2>Pick a font size</h2>

    <!-- Standard Radio Buttons (Dynamic content injected here) -->
    <div class="no-radio-buttons space-y-3" id="plain-radios">
        <!-- Content will be injected by JavaScript -->
    </div>

    <!-- Radio Cards (Dynamic content injected here) -->
    <div class="radio-cards" id="card-radios">
        <!-- Content will be injected by JavaScript -->
    </div>

    <script>
        // ----------------------------------------------------
        // CARD DATA DEFINITION (Modular Component Data)
        // ----------------------------------------------------
        const CARD_OPTIONS = [
            { id: 'small', title: 'SMALL', pixels: 16, subtitle: 'Smartphones' },
            { id: 'medium', title: 'MEDIUM', pixels: 18, subtitle: 'Laptops' },
            { id: 'large', title: 'LARGE', pixels: 20, subtitle: 'Desktops' },
            { id: 'xtreme', title: 'EXTREME', pixels: 24, subtitle: '4K screens' }
        ];

        // ----------------------------------------------------
        // CARD COMPONENT ABSTRACTION
        // ----------------------------------------------------

        /**
         * Generates the HTML string for a single radio card component.
         * @param {Object} data - Card data { id, title, pixels, subtitle }
         * @returns {string} - HTML string for the radio card.
         */
        function createRadioCard(data) {
            return `
                <div class="radio-card">
                    <input type="radio" id="${data.id}" name="font_size" value="${data.id}">
                    <label for="${data.id}">
                        <span class="card-title">${data.title}</span>
                        <p><span class="pixels-no">${data.pixels}</span>
                        <b>pixels</b><br>${data.subtitle}</p>
                    </label>
                </div>
            `;
        }

        /**
         * Generates the HTML string for a single standard (plain) radio input.
         * @param {Object} data - Card data { id, title, pixels, subtitle }
         * @returns {string} - HTML string for the plain radio input.
         */
        function createPlainRadio(data) {
            // Reusing the same ID/Value structure for seamless syncing
            return `
                <div>
                    <input type="radio" id="${data.id}-plain" name="font_size" value="${data.id}">
                    <label for="${data.id}-plain" class="ml-2">${data.title.charAt(0) + data.title.slice(1).toLowerCase()} - ${data.pixels} pixels (${data.subtitle})</label><br>
                </div>
            `;
        }


        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('toggle');
            const body = document.body;
            const plainRadiosContainer = document.getElementById('plain-radios');
            const cardRadiosContainer = document.getElementById('card-radios');

            // 1. DYNAMICALLY RENDER COMPONENTS
            let plainHtml = '';
            let cardHtml = '';

            CARD_OPTIONS.forEach(data => {
                plainHtml += createPlainRadio(data);
                cardHtml += createRadioCard(data);
            });

            plainRadiosContainer.innerHTML = plainHtml;
            cardRadiosContainer.innerHTML = cardHtml;
            // ----------------------------------------------------


            let isCardView = false;
            
            // Function to sync the selected value across all radio inputs
            const syncRadios = (sourceValue) => {
                const radios = document.querySelectorAll('input[name="font_size"]');
                radios.forEach(radio => {
                    radio.checked = (radio.value === sourceValue);
                });
            };

            // Toggle Handler
            toggleButton.addEventListener('click', () => {
                body.classList.toggle('show-plain');
                isCardView = !body.classList.contains('show-plain');
                
                toggleButton.textContent = isCardView ? 'Toggle Display (Current: Cards)' : 'Toggle Display (Current: Standard)';

                // Sync the current selection when switching views
                const activeRadio = document.querySelector('input[name="font_size"]:checked');
                if (activeRadio) {
                    syncRadios(activeRadio.value);
                }
            });

            // Event listener setup (must be done after content is rendered)
            const allRadios = document.querySelectorAll('input[name="font_size"]');
            allRadios.forEach(radio => {
                radio.addEventListener('change', (event) => {
                    syncRadios(event.target.value);
                });
            });


            // Initial check: default to 'small' and sync on load
            const initiallyChecked = document.querySelector('input[name="font_size"]:checked');
            if (!initiallyChecked) {
                // Default to small if nothing is checked in the HTML
                syncRadios('small');
            }
            
            // Set initial button text based on default state (plain/hidden cards)
            body.classList.remove('show-plain'); // Default to card view hidden
            isCardView = false;
            toggleButton.textContent = 'Toggle Display (Current: Standard)';
        });
    </script>
</body>
</html>
