<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "rgb(var(--background))",
                        foreground: "rgb(var(--foreground))",
                        card: "rgb(var(--card))",
                        "card-foreground": "rgb(var(--card-foreground))",
                        primary: "rgb(var(--primary))",
                        "primary-foreground": "rgb(var(--primary-foreground))",
                        secondary: "rgb(var(--secondary))",
                        "secondary-foreground": "rgb(var(--secondary-foreground))",
                        muted: "rgb(var(--muted))",
                        "muted-foreground": "rgb(var(--muted-foreground))",
                        accent: "rgb(var(--accent))",
                        "accent-foreground": "rgb(var(--accent-foreground))",
                        destructive: "rgb(var(--destructive))",
                        "destructive-foreground": "rgb(var(--destructive-foreground))",
                        border: "rgb(var(--border))",
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: 15 15 26;
            --foreground: 226 226 245;
            --card: 26 26 46;
            --card-foreground: 226 226 245;
            --primary: 164 143 255;
            --primary-foreground: 15 15 26;
            --secondary: 45 43 85;
            --secondary-foreground: 196 194 255;
            --muted: 34 34 68;
            --muted-foreground: 160 160 192;
            --accent: 48 48 96;
            --accent-foreground: 226 226 245;
            --destructive: 255 84 112;
            --destructive-foreground: 255 255 255;
            --border: 48 48 82;
        }
    </style>
</head>
<body class="bg-background text-foreground p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold">Theme Color Test</h1>

        <div class="bg-card p-6 rounded-lg border">
            <h2 class="text-xl font-semibold mb-2">Card Surface</h2>
            <p class="text-muted-foreground">This should have a different background than the main background.</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-primary p-4 rounded text-primary-foreground">Primary</div>
            <div class="bg-secondary p-4 rounded text-secondary-foreground">Secondary</div>
            <div class="bg-accent p-4 rounded text-accent-foreground">Accent</div>
            <div class="bg-destructive p-4 rounded text-destructive-foreground">Destructive</div>
        </div>

        <div class="bg-muted p-4 rounded">
            <p class="text-muted-foreground">Muted text color example</p>
        </div>
    </div>
</body>
</html>
