<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Test</title>
    <script src="https://cdn.tailwindcss.com/4.0.0-alpha.15"></script>
    <style type="text/tailwindcss">
        @theme {
          --color-background: rgb(15 15 26);
          --color-foreground: rgb(226 226 245);
          --color-card: rgb(26 26 46);
          --color-card-foreground: rgb(226 226 245);
          --color-primary: rgb(164 143 255);
          --color-primary-foreground: rgb(15 15 26);
          --color-secondary: rgb(45 43 85);
          --color-secondary-foreground: rgb(196 194 255);
          --color-muted: rgb(34 34 68);
          --color-muted-foreground: rgb(160 160 192);
          --color-accent: rgb(48 48 96);
          --color-accent-foreground: rgb(226 226 245);
          --color-destructive: rgb(255 84 112);
          --color-destructive-foreground: rgb(255 255 255);
          --color-border: rgb(48 48 82);
        }
    </style>
</head>
<body class="bg-background text-foreground p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold mb-6">Color Test with Tailwind CSS v4</h1>

        <div class="bg-card p-6 rounded-lg border border-border">
            <h2 class="text-xl font-semibold mb-2">Card Surface</h2>
            <p class="text-muted-foreground">This should have a different background color than the main background.</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-primary p-4 rounded text-primary-foreground text-center">Primary</div>
            <div class="bg-secondary p-4 rounded text-secondary-foreground text-center">Secondary</div>
            <div class="bg-accent p-4 rounded text-accent-foreground text-center">Accent</div>
            <div class="bg-destructive p-4 rounded text-destructive-foreground text-center">Destructive</div>
        </div>

        <div class="bg-muted p-4 rounded">
            <p class="text-muted-foreground">Muted text color example</p>
        </div>
    </div>
</body>
</html>
